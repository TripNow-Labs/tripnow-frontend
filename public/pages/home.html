<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripNow - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
    </style>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>

    <trip-header></trip-header>

    <section class="hero-section-wrapper">
        <div class="container hero-container">
            <div class="saudacao">
                <p>Olá viajante!👋</p>
                <h1>Onde vamos hoje?</h1>
            </div>
            <div class="hero-card">
                <div class="hero-card-bg-carousel">
                    <img src="/public/imagens/carousel/moutain.jpeg" class="active" alt="Destino 1">
                    <img src="/public/imagens/carousel/newyork.jpeg" alt="Destino 2">
                    <img src="/public/imagens/carousel/wingcloud.jpeg" alt="Destino 3">
                </div>
                <div class="hero-card-content">
                <h1>Sua Aventura <br>Começa Aqui</h1>
                <p>Crie itinerários de viagem personalizados em minutos. Descubra destinos incríveis e planeje sua
                    próxima fuga com facilidade.</p>
                
                <div style="display: flex; gap: 10px; width: 100%; flex-wrap: wrap;">
                    <a href="/public/pages/EscolherDestino.html" class="btn btn-hero" style="flex: 1; min-width: 140px; background-color: rgba(0, 180, 216, 0.2); border: 1px solid #00B4D8; backdrop-filter: blur(4px);">
                        <i class="fas fa-plus"></i> Novo Roteiro
                    </a>
                    <a href="/public/pages/ExplorarDestinos.html" class="btn btn-hero" style="flex: 1; min-width: 140px; background-color: rgba(255, 255, 255, 0.15); border: 1px solid white; backdrop-filter: blur(4px);">
                        <i class="fas fa-compass"></i> Explorar
                    </a>
                </div>
                </div>
            </div>

            <!-- <div class="hero-image-container">
                <img src="../imagens/photo-16.jpg" alt="Avião no pôr do sol">
            </div> -->

        </div>
    </section>

    <main class="container my-routes-section">
        <div class="routes-section-header">
            <h2>Próximos roteiros</h2>
            <a href="/public/pages/meusRoteiros.html" class="btn btn-hero" style="background-color: rgba(0, 180, 216, 0.2); border: 1px solid #00B4D8; backdrop-filter: blur(4px); padding: 8px 16px; font-size: 14px; width: fit-content;">
                Ver todos <i class="fas fa-arrow-right" style="margin-left: 5px;"></i>
            </a>
        </div>

        <div id="my-routes-container" class="route-card-grid">
            <p style="text-align: center; color: #666; width: 100%; padding: 20px;">Carregando seus roteiros...</p>
        </div>
    </main>

    <trip-footer></trip-footer>

    <script src="../js/layout.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/components/tripHeader.js"></script> <!-- import do component header -->
    <script src="../js/components/tripFooter.js"></script> <!-- import do component footer -->
</body>

</html>
