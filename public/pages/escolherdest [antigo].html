<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher Destino</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
    </style>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/escolherdest.css">
</head>

<body>

    <trip-header></trip-header>

    <main class="container">

        <section class="destination-header">
            <p class="breadcrumb">Início / <strong>Escolher Destino</strong></p>
            <h1 class="page-title">Escolha seu destino</h1>
            <p class="page-subtitle">Selecione a cidade para onde você quer viajar</p>
        </section>

        <div class="search-input-container">
            <i class="fas fa-search search-icon-input"></i>
            <input type="text" placeholder="Digite o nome da cidade..." class="city-search-input">
        </div>

        <section class="popular-cities-section" id="containerCards">
            <h2>Cidades Populares</h2>
            <div class="city-cards-grid"></div>
        </section>

    </main>

    <trip-footer></trip-footer>

    <script src="../js/layout.js"></script>
    <script src="../js/cardDinamico.js"></script>
    <script src="../js/btnVerDetalhes.js"></script>
    <script src="../js/components/tripHeader.js"></script> <!-- import do component header -->
    <script src="../js/components/tripFooter.js"></script> <!-- import do component footer -->
</body>

</html>
