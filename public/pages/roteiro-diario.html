<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Roteiro Diário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/roteiro-diario.css">
    <link rel="stylesheet" href="../css/detailsModal.css">
</head>

<body>

    <trip-header></trip-header>

    <main class="itinerary-container">

        <header class="trip-overview">
            <h1 id="trip-title" class="trip-title">Carregando destino...</h1>
            <p id="trip-dates" class="trip-subtitle">Calculando dias e datas...</p>
        </header>

        <nav class="days-navigation" id="days-nav">
        </nav>

        <section class="daily-content">
            <header class="day-header">
                <h2 id="current-day-title" class="day-date-title">Data do dia</h2>
                <span class="day-status">ATIVIDADES CONFIRMADAS</span>
            </header>

            <div id="activities-list" class="activities-container">
            </div>

            <div class="add-btn-container">
                <button id="add-activity-btn" class="fab-btn" aria-label="Adicionar atividade">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </section>

        <div id="search-modal" class="search-modal">
            <div class="search-modal-header">
                <button id="close-modal-btn" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="search" id="attraction-search-input" placeholder="Buscar por atração, museu...">
                </div>
            </div>

            <div class="search-filters">
                <button class="filter-pill active">Todos</button>
                <button class="filter-pill"><i class="fas fa-camera"></i> Cultura</button>
                <button class="filter-pill"><i class="fas fa-utensils"></i> Comida</button>
                <button class="filter-pill"><i class="fas fa-tree"></i> Lazer</button>
            </div>

            <div class="search-modal-content">
                <div class="results-header">
                    <h3 id="search-modal-title">Sugestões em Destino</h3>
                    <span id="search-results-count" class="results-count">0 resultados</span>
                </div>

                <div id="attractions-grid" class="attractions-grid">
                </div>
            </div>
        </div>

        <details-modal></details-modal>

    </main>

    <trip-footer></trip-footer>

    <script src="../js/layout.js"></script>
    <script src="../js/components/tripHeader.js"></script>
    <script src="../js/components/tripFooter.js"></script>
    <script src="../js/components/detailsModal.js"></script>
    <script src="../js/roteiro-diario.js"></script>
</body>

</html>
